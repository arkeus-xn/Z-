
name: Build ULTRA AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ULTRA-AI-Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v3

      - name: Zainstaluj Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Ustaw Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rozpakuj projekt
        run: |
          unzip -q ULTRA-AI-Android.zip -d extracted
          test -f extracted/ULTRA-AI-Android/settings.gradle.kts

      - name: Zbuduj APK debug
        run: gradle -p extracted/ULTRA-AI-Android assembleDebug --stacktrace

      - name: Udostępnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: ULTRA-AI-debug-apk
          path: extracted/ULTRA-AI-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retent
ion-days: 7
